
{% extends 'base.html' %}

{% block content %}
<h1>{{ product.name }}</h1>
<p>Category: {{ product.category.name }}</p>
<p>Price: ${{ product.price }}</p>
<p>Description: {{ product.content }}</p>
{% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.name }}" width="300">
{% endif %}
<a href="{% url 'product_list' %}">Back to list</a>
{% endblock %}
